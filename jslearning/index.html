<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js Learning</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- Rock Paper Scissor Game -->


    <header class="header">


        <section class="headingDiv">
        <h1 class="topHeading">Rock Paper Scissor</h1>
        </section>
    </header>



    <main>

   
        <section class="choices-section">

            <div class="choices rock-choice">
                <img src="rock.png" alt="rock image" class="rockImg">
            </div>

            <div class="choices paper-choice">
                <img src="paper.png" alt="paper image" class="paperImg">
            </div>

            <div class="choices scissor-choice">
                <img src="scissor.png" alt="scissor image" class="scissorImg">
            </div>

        </section>
        
        <!-- Score Section -->

        <section class="score-section">

            <div class="yourScoreDiv">

                <span class="yourScore scoresCount">0</span>

                <span class="names">You</span>
            </div>

            <div class="compScoreDiv">

                <span class="compScore scoresCount">0</span>
                 <span class="names">Comp</span>

            </div>

        </section>

        <!-- Start Game sec -->

        <section class="startSec">

           <div class="msgDiv">

            <h1 class="msg">Play Your Game</h1>

           </div>

        </section>


    </main>

    <script src="script.js"></script>
</body>

</html>
